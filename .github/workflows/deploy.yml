name: Deploy Breach

"on":
  push:
    branches:
      - main
    paths:
      - breach_release.zip
  workflow_dispatch: {}

concurrency:
  group: breach-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4
        with:
          path: release

      - name: Extract and validate game ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f release/breach_release.zip

          rm -rf game
          mkdir game
          unzip -q release/breach_release.zip -d game

          test -f game/1_SERVER_REPO_UPLOAD/worker.js
          test -f game/2_CLIENT_REPO_UPLOAD/index.html

          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find game/1_SERVER_REPO_UPLOAD game/2_CLIENT_REPO_UPLOAD -name '*.js' -print0)

          echo "Game ZIP validated."

      - name: Checkout server repo
        uses: actions/checkout@v4
        with:
          repository: kakrami/breach-online
          token: ${{ secrets.DEPLOY_TOKEN }}
          ref: main
          path: server

      - name: Checkout client repo
        uses: actions/checkout@v4
        with:
          repository: kakrami/breach
          token: ${{ secrets.DEPLOY_TOKEN }}
          ref: main
          path: client

      - name: Push server files
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            game/1_SERVER_REPO_UPLOAD/ server/

          git -C server config user.name "breach-release-bot"
          git -C server config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C server add -A

          if ! git -C server diff --cached --quiet; then
            git -C server commit -m "Deploy Breach release"
            git -C server push origin HEAD:main
          else
            echo "Server already matches release."
          fi

      - name: Push client files
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            game/2_CLIENT_REPO_UPLOAD/ client/

          git -C client config user.name "breach-release-bot"
          git -C client config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C client add -A

          if ! git -C client diff --cached --quiet; then
            git -C client commit -m "Deploy Breach release"
            git -C client push origin HEAD:main
          else
            echo "Client already matches release."
          fi

      - name: Complete
        run: echo "Server and client repositories updated."
